<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Runner</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1d2330;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    #gameCanvas {
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    p { color: #b8c0cc; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Typing Runner</h1> <!--Hard coded to display only jackrabbit, desert biome and normal difficulty.  Needs a menu to choose what the player wants.  Can be after the sign in page.-->
  <canvas id="gameCanvas" width="480" height="640"
          data-animal="jackrabbit" data-biome="desert"
          data-difficulty="normal" data-sound="1"></canvas>
  <p>Blue words turn, orange words jump. Press Enter to start, Esc to pause.</p>
  <script src="js/game.js"></script>
</body>
</html>
